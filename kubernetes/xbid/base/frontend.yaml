apiVersion: apps/v1
kind: Deployment
metadata:
  name: xbid-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xbid-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xbid-frontend
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/xbidlive/xbid-frontend:testnet
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: xbid-environment
          env:
            - name: API_INTERNAL_URL
              value: http://xbid-backend:4000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: xbid-frontend
spec:
  selector:
    app.kubernetes.io/name: xbid-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
