apiVersion: apps/v1
kind: Deployment
metadata:
  name: xbid-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xbid-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xbid-backend
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/xbidlive/xbid-backend:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: xbid-environment
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: xbid-postgres-app
                  key: uri
            - name: UPLOAD_DIR
              value: /app/var/uploads
          volumeMounts:
            - name: uploads
              mountPath: /app/var/uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: xbid-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: xbid-backend
spec:
  selector:
    app.kubernetes.io/name: xbid-backend
  ports:
    - name: http
      port: 4000
      targetPort: http
